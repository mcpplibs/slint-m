# Module wrapper; upstream API preserved. Policy: mcpp-index/docs/mwrap.md.
[package]
namespace   = "mcpplibs.mwrap"
name        = "slint"
version     = "1.19.0.2"
description = "Slint 1.19.0 C++ modules for mcpp (import mcpplibs.mwrap.slint;): the runtime API, the interpreter and the platform API over compat.slint, the features as constants; .slint files compile with mcpp.mcpplibs.slintgen"
license     = "Apache-2.0"
authors     = ["mcpp-community"]
repo        = "https://github.com/mcpplibs/slint-m"
platforms   = ["linux", "macos", "windows"]

[targets.slint]
kind = "lib"

[build]
sources      = ["src/*.cppm"]
# <mwrap/slint/macros.hpp>: <slint.h>'s macros (SLINT_FEATURE_*) for #if.
include_dirs = ["include"]

[dependencies]
# The SDK: libslint_cpp, its headers and slint-compiler. Re-exported, so a
# consumer's build program finds slint-compiler in it.
compat.slint = { version = "1.19.0", reexport = true }

# The build rule (module mcpp.mcpplibs.slintgen, rules/): handed to the
# consumer's build program, so this one dependency is enough to import it in
# build.mcpp -- the shape grpc-m gives grpcgen. It runs slint-compiler from
# compat.slint above: one SDK, one version.
[build-dependencies]
mcpplibs.slintgen = { path = "rules", host-module = true, reexport = true }

[package.metadata.mwrap]
upstream-version = "1.19.0"

[[runtime.deploy]]
from = "LICENSE"
to   = "licenses/slint"

[[runtime.deploy]]
from = "NOTICE"
to   = "licenses/slint"

[[runtime.deploy]]
from = "upstream/slint/README.md"
to   = "licenses/slint/upstream/slint"

[[runtime.deploy]]
from = "upstream/slint/LICENSE.md"
to   = "licenses/slint/upstream/slint"

[[runtime.deploy]]
from = "upstream/slint/LICENSES/GPL-3.0-only.txt"
to   = "licenses/slint/upstream/slint/LICENSES"

[[runtime.deploy]]
from = "upstream/slint/LICENSES/LicenseRef-Slint-Royalty-free-2.0.md"
to   = "licenses/slint/upstream/slint/LICENSES"

[[runtime.deploy]]
from = "upstream/slint/LICENSES/LicenseRef-Slint-Software-3.0.md"
to   = "licenses/slint/upstream/slint/LICENSES"
