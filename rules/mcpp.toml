# mcpplibs.mplugin.slint — how a `.slint` file becomes part of a C++ program, as a package.
#
# The module is `mcpplibs.mplugin.slint` (rules/src/slint.cppm). A consumer's
# build.mcpp imports it:
#
#   import mcpp;
#   import mcpplibs.mplugin.slint;
#   int main() { return mcpplibs::mplugin::slint::compile({}) ? 0 : 1; }
#
# It lives here, beside the modules whose Slint SDK it drives, as grpcgen lives
# in grpc-m: mcpp-plugins holds the rules that are not tied to one library's
# release, this repository the one that is.
#
# One name in three spellings: a build plugin's id is `<owner>.mplugin.<name>`
# (mcpp-index docs/build-plugins.md), and its module and C++ namespace are that
# id, so `mcpp::` (the engine) is never shadowed inside it:
#
#   package    mcpplibs.mplugin.slint
#   module     mcpplibs.mplugin.slint
#   namespace  mcpplibs::mplugin::slint
#
# mcpplibs.mwrap.slint re-exports it, so a project that depends on the wrapper
# imports the module in its build.mcpp and passes its `.slint` files as
# `options::sources`.
#
# Versioned by the Slint it drives: 1.19.0 is the first release of this package,
# built from the archive of slint-m's tag mwrap-1.19.0.3 (the wrapper's
# revision is not the rule's).
[package]
name        = "slint"
version     = "1.19.0"
standard    = "c++23"
description = "slint-compiler as an importable mcpp build rule (module mcpplibs.mplugin.slint)"
license     = "Apache-2.0"
repo        = "https://github.com/mcpplibs/slint-m"
platforms   = ["linux", "macos", "windows"]

# The rule reuses mcpp.plugins' tool resolution (`mcpp.plugins.tool`, feature
# `plugins-core`) and records its version as a fact. What a rule's module
# imports is in its `[dependencies]` (mcpp 2026.10.11.1+); a consumer's build
# program compiles it with the module.
[dependencies]
mcpp.plugins = { version = "0.26.1", features = ["plugins-core"] }

[targets.slint]
kind = "lib"
