# slintgen — how a `.slint` file becomes part of a C++ program, as a package.
#
# The module is `mcpp.mcpplibs.slintgen` (rules/src/slint.cppm). A consumer's
# build.mcpp imports it:
#
#   import mcpp;
#   import mcpp.mcpplibs.slintgen;
#   int main() { return mcpp::mcpplibs::slintgen::compile({}) ? 0 : 1; }
#
# It lives here, beside the modules whose Slint SDK it drives, as grpcgen lives
# in grpc-m: mcpp-plugins holds the rules that are not tied to one library's
# release, this repository the one that is.
#
# One name in three spellings, as mcpplibs.openkal-bind is (SPEC-007 R9.6, a
# third-party plugin's `mcpp.<namespace>.<name>`):
#
#   package    mcpplibs.slintgen
#   module     mcpp.mcpplibs.slintgen
#   namespace  mcpp::mcpplibs::slintgen
#
# mcpplibs.mwrap.slint re-exports it, so a project that depends on the wrapper
# imports the module in its build.mcpp and passes its `.slint` files as
# `options::sources`.
#
# Versioned with slint-m (and so with the Slint it is built against).
[package]
name        = "slintgen"
version     = "1.19.0.2"
standard    = "c++23"
description = "slint-compiler as an importable mcpp build rule (module mcpp.mcpplibs.slintgen)"
license     = "Apache-2.0"
repo        = "https://github.com/mcpplibs/slint-m"
platforms   = ["linux", "macos", "windows"]

# The rule reuses mcpp.plugins' tool resolution (`mcpp.plugins.tool`, feature
# `plugins-core`) and records its version as a fact. What a rule's module
# imports is in its `[dependencies]` (mcpp 2026.10.11.1+); a consumer's build
# program compiles it with the module.
[dependencies]
mcpp.plugins = { version = "0.26.1", features = ["plugins-core"] }

[targets.slintgen]
kind = "lib"
